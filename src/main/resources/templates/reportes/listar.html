<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Usuarios | Sistema de Gestión</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tu CSS global -->
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
  <!-- ✅ Menú fijo (fragmento compartido) -->
  <header th:replace="fragments/menu :: menu"></header>

  <!-- ✅ Contenido principal -->
  <main class="container mt-4">
    <div class="content">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1 class="text-primary mb-0">Reportes</h1>
          <p class="mb-0">Bienvenido al módulo de Administracion de reportes.</p>
        </div>
  	<!-- ✅ Botón para crear nuevo rol 	-->
  	<a th:href="@{/reportes/nuevo}" class="btn btn-success">
  	  <i class="bi bi-plus-circle"></i> + Reporte
  	</a>

      </div>

      <table class="table table-striped table-hover mt-3 align-middle">
        <thead class="table-dark">
          <tr>
            <th scope="col">ID</th>
            <th scope="col">Area</th>
			<th scope="col">Zona</th>
			<th scope="col">Manager</th>
			<th scope="col">titulo</th>
			<th scope="col">Descripcion</th>
			<th scope="col">Fecha</th>
			<th scope="col">Estado</th>
          </tr>
        </thead>
        <tbody>
          <!-- ✅ Recorre la lista de usuarios -->
          <tr th:each="reporte : ${reportes}">
  		<td th:text="${reporte.reporteID}"></td>
            <td th:text="${reporte.area.nombreArea}"></td>
			<td th:text="${reporte.zona.nombreZona}"></td>
			<td th:text="${reporte.manager?.nombreCompleto ?: 'Sin asignar'}"></td>
			<td th:text="${reporte.titulo}"></td>
			<td th:text="${reporte.descripcion}"></td>
			<td th:text="${reporte.fechaReporte}"></td>
			<td th:text="${reporte.estado}"></td>
          </tr>

          <!-- ✅ Si no hay usuarios -->
  	  <tr th:if="${#lists.isEmpty(reportes)}">
  	    <td colspan="6" class="text-center text-muted">
  	      No hay roles registrados.
  	    </td>
  	  </tr>

        </tbody>
      </table>
    </div>
  </main>
  

  <!-- ✅ Footer fijo (fragmento compartido) -->
  <footer th:replace="fragments/footer :: footer"></footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
