<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Crear Reunión | Sistema de Gestión</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- ✅ Menú global -->
<header th:replace="fragments/menu :: menu"></header>

<main class="container mt-4">
  <div class="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="text-primary mb-0">Nueva Reunión</h1>
        <p class="mb-0">Creación de reunión para el reporte seleccionado.</p>
      </div>
    </div>

    <form th:action="@{/reuniones/guardar}" th:object="${reunion}" method="post" class="card shadow p-4">

      <!-- Reporte (solo lectura) -->
      <div class="mb-3">
        <label class="form-label fw-bold">Reporte:</label>
        <input type="text" class="form-control" th:value="${reporte.titulo}" readonly>
        <input type="hidden" th:field="*{reporte.reporteID}">
      </div>

	  <div class="row align-items-center mb-3">
	    <!-- Manager -->
	    <div class="col-sm-6">
	      <label class="form-label fw-bold">Manager:</label>
	      <input type="text" class="form-control" th:value="${managerNombre}" readonly>
	      <input type="hidden" th:field="*{manager}">
	    </div>

	    <!-- Fecha -->
	    <div class="col-sm-6">
	      <label class="form-label fw-bold">Fecha de Reunión:</label>
	      <input type="hidden" th:field="*{fechaReunion}" />
	      <span class="form-control-plaintext"
	            th:text="${#temporals.format(reunion.fechaReunion, 'dd/MM/yyyy HH:mm')}"></span>
	    </div>
	  </div>

      <!-- Observaciones -->
      <div class="mb-3">
        <label class="form-label fw-bold">Observaciones:</label>
        <textarea class="form-control" rows="4" th:field="*{observaciones}"></textarea>
      </div>

	  <!-- Botones de acción -->
	  <div class="d-flex justify-content-between mt-4">
		<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalPlanAccion">
		  <i class="bi bi-clipboard-plus"></i> Agregar Plan de Acción
		</button>


		<a th:href="@{/reportesmanager/listar}" class="btn btn-secondary">
		  <i class="bi bi-arrow-left"></i> Ver Planes
		</a>
		
	    <a th:href="@{/reportesmanager/listar}" class="btn btn-secondary">
	      <i class="bi bi-arrow-left"></i> Regresar
	    </a>
	  </div>

    </form>
  </div>
</main>

<!-- Incluimos el fragment del modal -->
<div th:replace="fragments/modal-plan-accion :: modalPlanAccion"></div>



<!-- ✅ Footer -->
<footer th:replace="fragments/footer :: footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
