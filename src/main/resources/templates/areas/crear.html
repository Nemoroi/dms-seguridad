<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nueva Área | Sistema de Gestión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
  <header th:replace="fragments/menu :: menu"></header>

  <main class="container mt-4">
    <h2 class="text-primary mb-4">Registrar Nueva Área</h2>

    <form th:action="@{/areas/guardar}" th:object="${area}" method="post" class="needs-validation">

      <div class="mb-3">
        <label class="form-label">Nombre del Área</label>
        <input type="text" th:field="*{nombreArea}" class="form-control" placeholder="Ingrese el nombre del área" required>
      </div>

      <div class="d-flex justify-content-between mt-4">
        <a th:href="@{/areas/listar}" class="btn btn-secondary">Volver</a>
        <button type="submit" class="btn btn-success">Guardar Área</button>
      </div>
    </form>
  </main>

  <footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
