<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Detalle Plan de Acción</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- CSS global -->
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header th:replace="fragments/menu :: menu"></header>

<div class="container mt-4">
    <h1>Completar Plan de Acción #<span th:text="${plan.planID}"></span></h1>

    <form th:action="@{/planes/{id}/guardar(id=${plan.planID})}" method="post">
        <div class="mb-3">
            <label>Descripción del Plan:</label>
            <textarea class="form-control" rows="3" readonly th:text="${plan.descripcion}"></textarea>
        </div>

        <div class="mb-3">
            <label>Descripción de Ejecución:</label>
            <textarea class="form-control" rows="3" name="descripcionEjecucion"
                      th:text="${plan.descripcionEjecucion}"></textarea>
        </div>

        <div class="mb-3">
            <label>Evidencia:</label>
            <input type="text" class="form-control" name="evidencia" th:value="${plan.evidencia}">
        </div>

        <div class="mb-3">
            <label>Estado:</label>
            <select class="form-control" name="estado">
                <option th:value="Pendiente" th:selected="${plan.estado=='Pendiente'}">Pendiente</option>
                <option th:value="EnProceso" th:selected="${plan.estado=='EnProceso'}">En Proceso</option>
                <option th:value="Ejecutado" th:selected="${plan.estado=='Ejecutado'}">Ejecutado</option>
                <option th:value="Cerrado" th:selected="${plan.estado=='Cerrado'}">Cerrado</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/listarPlanes}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

<footer th:replace="fragments/footer :: footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
